<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page not found – Campfire</title>
	<script>
		// Every screen of the web app in app/ has an address of its own (/app/song/…), which is not a file, so GitHub
		// Pages answers it with this page. It is sent on to the app's own page with the whole path in the query string
		// (/app/?/song/…), and the app's index.html puts it back into the address bar. The ampersands of a query string
		// the address already had are escaped, so that index.html can tell them from the one this adds. Any other
		// address is simply missing, and gets the page below.
		(function (l) {
			var segments = l.pathname.split("/").filter(Boolean);
			if (segments[0] === "app" && segments.length > 1) {
				l.replace(
					"/app/?/" + segments.slice(1).join("/") +
					(l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
					l.hash
				);
			}
		}(window.location));
	</script>
	<meta name="theme-color" content="#FAF8FE" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#15121C" media="(prefers-color-scheme: dark)">
	<link rel="icon" href="/assets/icon.svg?v=8ba29e56" type="image/svg+xml">
	<link rel="stylesheet" href="/assets/site.css?v=c92802cd">
</head>
<body>
<header class="site-header">
	<div class="wrap">
		<a class="brand" translate="no" href="/"><img src="/assets/icon.svg?v=8ba29e56" alt="">Campfire</a>
	</div>
</header>
<div class="wrap">
	<main class="document" id="main">
		<h1 id="heading">There’s nothing at this address.</h1>
		<p id="text">The page may have moved, or the link has a typo in it. The <a href="/">home page</a> has everything else.</p>
	</main>
</div>
<script>
	// In the language picked in the site's picker, or else the first of the browser's languages the site has, with a
	// link to the home page in that language, from the right in Hebrew. English is the page as it is.
	(function (d) {
		var texts = {
			de: { title: "Seite nicht gefunden – Campfire", heading: "Unter dieser Adresse gibt es nichts.", text: "Die Seite wurde vielleicht verschoben, oder der Link enthält einen Tippfehler. Alles andere findest du auf der <a href=\"/\">Startseite</a>." },
			es: { title: "Página no encontrada – Campfire", heading: "No hay nada en esta dirección.", text: "Puede que la página se haya movido o que el enlace tenga una errata. En la <a href=\"/\">página de inicio</a> está todo lo demás." },
			fr: { title: "Page introuvable – Campfire", heading: "Il n’y a rien à cette adresse.", text: "La page a peut-être été déplacée, ou le lien contient une faute de frappe. La <a href=\"/\">page d’accueil</a> mène à tout le reste." },
			he: { title: "הדף לא נמצא – Campfire", heading: "אין כלום בכתובת הזו.", text: "ייתכן שהדף הועבר, או שיש בקישור שגיאת הקלדה. כל השאר נמצא ב<a href=\"/\">דף הבית</a>." },
			hu: { title: "Az oldal nem található – Campfire", heading: "Ezen a címen nincs semmi.", text: "Lehet, hogy az oldal máshová került, vagy elírás van a linkben. A <a href=\"/\">kezdőlapon</a> minden más megtalálható." },
			it: { title: "Pagina non trovata – Campfire", heading: "A questo indirizzo non c’è niente.", text: "La pagina potrebbe essere stata spostata, o il link contiene un errore di battitura. La <a href=\"/\">home page</a> ha tutto il resto." },
			ro: { title: "Pagina nu a fost găsită – Campfire", heading: "La această adresă nu se află nimic.", text: "Pagina poate să se fi mutat sau linkul are o greșeală de scriere. <a href=\"/\">Pagina principală</a> are tot restul." }
		};
		var picked = null;
		try { picked = localStorage.getItem("language"); } catch (e) {}
		// Older browsers still name Hebrew by its retired code, iw.
		var codes = [picked].concat((navigator.languages || [navigator.language]).map(function (tag) { return String(tag).slice(0, 2).toLowerCase().replace("iw", "he"); }));
		var language = codes.filter(function (code) { return code === "en" || texts.hasOwnProperty(code); })[0];
		var text = texts[language];
		if (!text) return;
		d.documentElement.lang = language;
		if (language === "he") d.documentElement.dir = "rtl";
		d.title = text.title;
		d.getElementById("heading").textContent = text.heading;
		d.getElementById("text").innerHTML = text.text.replace('href="/"', 'href="/' + language + '/"');
	}(document));
</script>
</body>
</html>
