<head>
    <meta charset="UTF-8">
    <!-- Every screen of the app has an address of its own (…/app/song/…), and this page is only ever loaded as
         the folder it lives in: a deeper address is not a file, so the host's 404 page sends it here with the path in
         the query string (…/app/?/song/…, see 404.html in the site's repository), and the development server
         redirects the same way. This runs before anything on the page is fetched, and does two things with it:

         - It writes that folder into a <base>, which is what every relative address on the page and in the app is
           resolved against from then on - the icon and the fonts below, campfire.js, the binaries, the resources
           Compose fetches as it needs them and the storage worker the first write starts - so they keep working
           once the app has put a deeper address into the address bar.
         - It puts the address the query string carries back into the address bar, where the app reads it as the
           screen to open on. The history entry's state is kept, although a page loaded again starts at the bottom
           of its own history either way.

         A query string that does not start with a slash is not touched: that is an authorization answer, which the
         app takes out itself once it has read it. -->
    <script type="application/javascript">
        (function (l) {
            var folder = l.pathname.replace(/[^\/]*$/, '');
            var base = document.createElement('base');
            base.href = folder;
            document.head.appendChild(base);
            if (l.search[1] === '/') {
                var decoded = l.search.slice(2).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(window.history.state, '', folder + decoded + l.hash);
            }
        }(window.location));
    </script>
    <!-- The decisions behind keeping the app in the browser and handing it shared links (see the end of the page),
         apart from everything that acts on them so that app/web/tests/offline.test.cjs can run them as they are. Plain
         functions of what the build says, what the cache holds, what the deployment answered, and what the address and
         session storage carry. -->
    <script id="campfire-launch" type="application/javascript">
        window.campfireLaunch = (function () {
            'use strict';

            var ANSWER_TIMEOUT = 3000;
            var ANSWER_TIMEOUT_WHEN_KEPT = 800;
            // Any version's payload, as ShareLinks.kt's laterVersionPayload has it, and no longer than an address it reads.
            var SHARED_LINK = /^#([1-9][0-9]{0,5}\.[A-Za-z0-9._~%-]+)$/;
            var MAX_SHARED_LINK_LENGTH = 4096;

            /** The address a file of a build is asked for and kept under: its path, versioned by its own content. */
            function addressOf(path, entry, folder) {
                var url = new URL(path, folder);
                url.searchParams.set('v', entry.sha256.substring(0, 16));
                return url.href;
            }

            /** The files of [files], a build's map, that are not among [kept], the addresses the cache holds. */
            function missingFiles(files, kept, folder) {
                var held = {};
                kept.forEach(function (address) {
                    held[address] = true;
                });
                return Object.keys(files).sort().map(function (path) {
                    return { path: path, entry: files[path], address: addressOf(path, files[path], folder) };
                }).filter(function (file) {
                    return !held[file.address];
                });
            }

            /** What the cache holds that the build of [files] does not name, the kept page aside. */
            function staleAddresses(files, kept, folder) {
                var named = {};
                Object.keys(files).forEach(function (path) {
                    named[addressOf(path, files[path], folder)] = true;
                });
                return kept.filter(function (address) {
                    return address !== folder && !named[address];
                });
            }

            /** Whether [text], a kept page, is the page of build [id]: the build writes its id into the page. */
            function isPageOf(text, id) {
                return typeof text === 'string' && text.indexOf('{"id":' + JSON.stringify(id) + ',') !== -1;
            }

            /** The answer build.json gave, or null for one that is not a build's. */
            function parseAnswer(value) {
                return value && typeof value.id === 'string' && typeof value.page === 'string'
                && value.files && typeof value.files === 'object' ? value : null;
            }

            /**
             * Whether to start the page's own build ("keep") or download the one the deployment named and start that
             * ("update"). A build the page already reloaded for once in this tab is not tried again: a deployment
             * whose files keep failing their check would otherwise reload the page for ever.
             */
            function nextStep(ownId, answer, reloadedFor) {
                return answer && answer.id !== ownId && answer.id !== reloadedFor ? 'update' : 'keep';
            }

            /**
             * Whether the kept build of [files] is whole: its page kept, the worker that answers with it active and
             * every file of its map among [kept].
             */
            function isComplete(files, kept, folder, isPageKept, isWorkerActive) {
                return !!isPageKept && !!isWorkerActive && missingFiles(files, kept, folder).length === 0;
            }

            /**
             * How long after the launch began the answer of build.json is waited for. A whole kept build only waits
             * briefly, since without an answer it starts all the same - unless an answer that came too late on a
             * previous launch named another build ([updateWaiting]), which this launch then waits the full time for,
             * so that a network that is always slow still gets a release, or the fix of a broken one, one launch
             * later. A waiting id that is the page's own is a release that has already arrived.
             */
            function answerWindow(isComplete, updateWaiting, ownId) {
                return isComplete && (!updateWaiting || updateWaiting === ownId) ? ANSWER_TIMEOUT_WHEN_KEPT : ANSWER_TIMEOUT;
            }

            /**
             * Whether a page restored from the back/forward cache has to start again: another page launched the app while this
             * one was away, and may have changed every file this one remembers. [own] is the claim this page made as it
             * launched, [latest] the one the origin holds now; either missing means it cannot tell, which is answered the
             * safe way.
             */
            function isClaimedElsewhere(own, latest) {
                return !own || own !== latest;
            }

            /**
             * The payload of a shared song or setlist link that the fragment [hash] carries (`#1.setlist.…`, which the
             * landing page leads to as /app/#…), or null for any other fragment. Only its shape is checked here, a
             * version first, so that a link of a later format still reaches the app and is told apart there:
             * ShareLinks.kt in :data:model reads it strictly, and builds the download address itself.
             */
            function sharedLinkPayload(hash) {
                if (typeof hash !== 'string' || hash.length > MAX_SHARED_LINK_LENGTH) {
                    return null;
                }
                var match = SHARED_LINK.exec(hash);
                return match ? match[1] : null;
            }

            /** The payloads the stored list [text] holds; anything unreadable holds none. */
            function readSharedLinks(text) {
                var value = null;
                try {
                    value = JSON.parse(text);
                } catch (error) {
                    return [];
                }
                return Array.isArray(value) ? value.filter(isSharedLinkPayload) : [];
            }

            /**
             * [stored] with those of [payloads] that are links and not among it yet after it. A link that is still
             * waiting is not taken twice: a tab that offered it to this one and heard back too late offers it again.
             */
            function withSharedLinks(stored, payloads) {
                var result = stored.slice();
                payloads.forEach(function (payload) {
                    if (isSharedLinkPayload(payload) && result.indexOf(payload) === -1) {
                        result.push(payload);
                    }
                });
                return result;
            }

            /** [stored] without [payload]. */
            function withoutSharedLink(stored, payload) {
                return stored.filter(function (each) {
                    return each !== payload;
                });
            }

            function isSharedLinkPayload(value) {
                return typeof value === 'string' && sharedLinkPayload('#' + value) === value;
            }

            return {
                ANSWER_TIMEOUT: ANSWER_TIMEOUT,
                addressOf: addressOf,
                missingFiles: missingFiles,
                staleAddresses: staleAddresses,
                isPageOf: isPageOf,
                parseAnswer: parseAnswer,
                nextStep: nextStep,
                isComplete: isComplete,
                answerWindow: answerWindow,
                isClaimedElsewhere: isClaimedElsewhere,
                sharedLinkPayload: sharedLinkPayload,
                readSharedLinks: readSharedLinks,
                withSharedLinks: withSharedLinks,
                withoutSharedLink: withoutSharedLink
            };
        })();
    </script>
    <!-- The fallback for a browser without the VirtualKeyboard API, which the app uses to lay the keyboard over the
         page and keep clear of it as an inset (ProvideKeyboardInsets): with resizes-content Firefox makes the page
         itself shorter while the keyboard is up, and the canvas is laid out above it the way Android's adjustResize
         does it; by default only the visual viewport shrinks, leaving the bottom of the app under the keyboard and the
         whole canvas panned up to keep the focused field in view. Safari ignores the key. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- The two schemes of the app's own color: the dark background, and the light surfaceContainerHigh, since Chrome
         ignores a theme-color as light as the light background. Once the preferences are read the app writes the
         palette it is drawn in over both (see BrowserThemeColorEffect in CampfireWebApp.kt). -->
    <meta name="theme-color" content="#E9E7F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15121C" media="(prefers-color-scheme: dark)">

    <!-- Every file of a distribution is asked for with its own version in the query string, this page aside, which
         is the one address that has to stay put. The host lets a browser keep any file for ten minutes by its address
         and a deployment replaces the files one address at a time, so without it a page could start with a campfire.js
         whose binaries were already deleted, or a binary with the resources of another release. With it every release
         is a set of addresses of its own, which only the page that belongs to it knows, while a file a release left as
         it was keeps its address and stays cached. The versions are written by the build together with the rest of
         the manifest (see build.gradle.kts): a hash of each file's content, so a build of the same sources asks for the
         same addresses. A file the manifest does not name is asked for as it is. They are also the addresses the files
         are kept in the browser under (see the end of the page), so a request the app makes offline finds its file.

         Everything the app fetches goes through fetch(), which is wrapped here for good, before campfire.js is loaded;
         campfire.js itself and the storage worker are asked for by name through campfireVersioned. Only addresses inside
         this page's folder are touched, so a request to the sync service is not. On the development server there is no
         manifest and nothing is changed.

         The fonts the interface (see InterfaceTypography.wasmJs.kt) and the tabs (see MonospaceFontFamily.wasmJs.kt) are
         set in are preloaded from here as well, since the address a preload answers has to be the versioned one: they
         are fetched alongside the binaries rather than after them, so they are in by the time the app asks for them.
         "fetch" and "crossorigin" are what make the Compose resource reader's own fetch() the request this answers;
         as="font" would be downloaded twice. The loading screen's text is set in the same Inter files, given to the page
         as font faces at their versioned addresses, which the preloads have put in the browser's cache. -->

    <!-- The icon of the theme color the user chose, which the app leaves in local storage whenever it shows one (see
         FaviconEffect in CampfireWebApp.kt), so that the tab and the loading screen are in that color before the app
         that knows it has been downloaded. Only a name the app writes is taken: this is a URL on the page. Asked for by
         its versioned address like every other file, which is the address it is kept under for an offline start. -->
    <script type="application/javascript">
        (function () {
            var icon = 'favicon-campfire.png';
            try {
                var chosen = window.localStorage.getItem('campfire-icon');
                if (/^favicon-[a-z]+\.png$/.test(chosen || '')) {
                    icon = chosen;
                }
            } catch (e) {
            }
            icon = window.campfireVersioned(icon);
            document.querySelector('link[rel="icon"]').setAttribute('href', icon);
            document.documentElement.style.setProperty('--splash-icon', 'url("' + icon + '")');
        })();
    </script>
    <style>
        /* The palette is CampfireColorScheme's, so the splash screen and the first
           composed frame paint the same background and the handover is invisible. */
        :root {
            color-scheme: light dark;
            --background: #FAF8FE;
            --on-background: #1D1A23;
            --track: #E5DFF5;
            --indicator: #5A49CA;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #15121C;
                --on-background: #E3E1EA;
                --track: #494456;
                --indicator: #D0BCFF;
            }
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--background);
        }

        /* The Compose canvas replaces the contents of this element, so it must be a container of its
           own rather than <body>: the splash screen is a sibling that outlives the handover. */
        #app {
            width: 100%;
            height: 100%;
        }

        /* Compose gives its canvas "pan-x pan-y", so that a page it is nested in can still be scrolled, and hands a
           touch gesture to the browser whenever it reported a scroll by the first touchmove but moved nothing with it.
           A drag that sets off while a scroll is still settling reports an empty one as the finger lands, and the
           browser then cancels the whole gesture for a page that cannot scroll at all, so the drag is lost: the first
           touch at the top of a song, or a drag that starts on a text field in a sheet. This page is the app and nothing
           else, so every gesture is the app's. Set on the container rather than on the canvas: the canvas is inside the
           shadow root Compose attaches, which no selector of this page reaches, and the browser allows a touch only
           what every element from the canvas up allows, across that boundary too. */
        #app {
            touch-action: none;
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: var(--background);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            transition: opacity 300ms ease-out;
        }

        #splash.is-done {
            opacity: 0;
            pointer-events: none;
        }

        #splash-icon {
            width: 96px;
            height: 96px;
            background-image: var(--splash-icon, url("favicon-campfire.png"));
            background-size: contain;
            background-repeat: no-repeat;
        }

        #splash-name {
            color: var(--on-background);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        #splash-track {
            width: 200px;
            max-width: 60vw;
            height: 4px;
            border-radius: 2px;
            background-color: var(--track);
            overflow: hidden;
        }

        #splash-bar {
            width: 100%;
            height: 100%;
            border-radius: 2px;
            background-color: var(--indicator);
            transform: scaleX(0);
            transform-origin: left center;
        }

        #splash-message {
            max-width: 280px;
            margin: 0 24px;
            color: var(--on-background);
            font-size: 14px;
            line-height: 20px;
            text-align: center;
        }

        #splash-retry {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            background-color: var(--indicator);
            color: var(--background);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (prefers-reduced-motion: reduce) {
            #splash {
                transition: none;
            }
        }
    </style>
</head>
<body>
<div id="app"></div>
<div id="splash">
    <div id="splash-icon"></div>
    <div id="splash-name">Campfire</div>
    <div id="splash-track" role="progressbar" aria-label="Campfire" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="splash-bar"></div>
    </div>
    <!-- Only shown when the app could not be started. In the browser's language where that is one the app speaks:
         the app's own choice is in storage this page does not read, and follows the browser unless it was changed. -->

    <button id="splash-retry" type="button" hidden></button>

<script type="application/javascript">
    (function () {

        // be, it measures the binaries as the app fetches them - the only part of a cold start worth measuring,
        // about 96% of it, and the only part that arrives through fetch(), which is what can be watched from here.

                unsupported: 'Ez a böngésző nem tudja futtatni a Campfire-t. Chrome vagy Edge 119, Firefox 120, Safari 18.2 (iOS 18.2) vagy ezeknél újabb verzió kell hozzá.',

                unsupported: 'Este navegador no puede ejecutar Campfire. Necesita Chrome o Edge 119, Firefox 120, Safari 18.2 (iOS 18.2) o una versión posterior.',

        }
        retry.textContent = text.retry;

        var expected = BUILD ? BUILD.binaryBytes : 0;
        var binaries = BUILD ? BUILD.binaryCount : 0;
        var received = 0;
        var completed = 0;
        var pending = 0;
        var startedAt = 0;
        var isReady = false;
        var isFailed = false;
        var shown = 0;

        // rather than straight from the network as the app asks for its files.
        var isKeeping = false;
        // Whether that build is complete, as far as this launch found: the one value the Storage row in Settings

        // not. So the download owns the first 92% of the bar and the rest is a decay that approaches
        // but never reaches the end, until the first composed frame reports back.

            if (isKeeping) {
                return hasStarted;
            }

                return 1;

                if (!startedAt) {

        var postDownloadTimer = null;
        var lastTransform = null;
        var lastPercent = -1;

            // size the network hands over, and following those exactly makes the bar stutter. Never

            // the server said) is a correction the bar waits out rather than shows.

                    schedule();

            if (!isDrawScheduled && !isFailed) {
                isDrawScheduled = true;
                requestAnimationFrame(draw);
            }

            if (isReady || isFailed) {
                return;
            }

        }

        function onAddressChanged() {
            if (takeSharedLinkFromAddress() && isTurnedAway) {
                offerSharedLinks();
            }
        }

        // What ShareLinks.wasmJs.kt reads the links through: next() is the first one waiting, as soon as there is
        // one, and take() removes it once the app has it.
        window.campfireSharedLinks = {
            next: function () {
                return new Promise(function (resolve) {
                    (function check() {
                        var stored = storedSharedLinks();
                        if (stored.length > 0) {
                            resolve(stored[0]);
                        } else {
                            sharedLinkWaiter = check;
                        }
                    })();
                });
            },
            take: function (payload) {
                storeSharedLinks(window.campfireLaunch.withoutSharedLink(storedSharedLinks(), payload));
            }
        };
        takeSharedLinkFromAddress();
        window.addEventListener('popstate', onAddressChanged);
        window.addEventListener('hashchange', onAddressChanged);

        // Asked before the library is claimed and before anything of the app is fetched: a browser that cannot run
        // it would otherwise download sixteen megabytes to find that out, and be told to check its connection.
        if (isBrowserSupported()) {
            claimLibrary(launch, showAlreadyOpen);
        } else {
            showUnsupported();
        }
    })();
</script>
</body>
</html>
