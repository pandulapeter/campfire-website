	<link rel="stylesheet" href="../assets/site.css?v=b968cb73">
	<style>
		/* The landing page of a shared link: a column in the middle of the page with the two ways to open it as cards, the
		   first of them filled, the app's store under them, the file after a line, and what Campfire is at the bottom. */
		.shared { max-width: 600px; margin: 0 auto; }
		.shared h1 { overflow-wrap: anywhere; margin-bottom: 12px; }
		.shared .lede { font-size: 18px; margin: 0 0 32px; }
		.in-app { margin: 0 0 24px; padding: 12px 16px; border-radius: 12px; background: var(--container); font-size: 15px; }
		.shared .in-app { color: var(--on-background); }
		.choices { display: grid; gap: 12px; }
		.choice { display: flex; align-items: center; gap: 16px; min-height: 80px; padding: 16px 20px; border-radius: 16px; background: var(--container-low); border: 1px solid var(--outline-variant); color: var(--on-background); text-decoration: none; line-height: 1.4; }
		.choice svg { flex-shrink: 0; width: 28px; height: 28px; color: var(--primary); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
		.choice strong { display: block; font-size: 17px; color: inherit; }
		.choice span { color: var(--muted); font-size: 15px; }
		.choice::after { content: "→"; content: "→" / ""; margin-left: auto; padding-left: 8px; font-size: 20px; color: var(--muted); }
		.choice.main { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
		.choice.main svg, .choice.main span, .choice.main::after { color: inherit; }
		.choice.main span { opacity: 0.85; }
		@media (hover: hover) and (pointer: fine) {
			.choice:hover { background: color-mix(in srgb, var(--primary) 8%, var(--container-low)); border-color: var(--outline); }
			.choice.main:hover { background: var(--primary); border-color: var(--primary); filter: brightness(1.08); }
		}
		@media (hover: none) {
			.choice:active { background: color-mix(in srgb, var(--primary) 18%, var(--container-low)); border-color: var(--primary); transform: scale(0.98); }
			.choice.main:active { background: var(--primary); box-shadow: inset 0 0 0 100vmax color-mix(in srgb, currentColor 18%, transparent); }
		}
		.shared .fallback { margin: 16px 0 0; font-size: 15px; }
		.file { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--outline-variant); }
		.file .button { flex-shrink: 0; gap: 8px; }
		.file .button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
		.shared .file p { flex: 1 1 240px; margin: 0; font-size: 14px; }
		.about { display: flex; align-items: center; gap: 16px; margin-top: 48px; padding: 20px 24px; border-radius: 20px; background: var(--container); }
		.about img { flex-shrink: 0; width: 48px; height: 48px; }
		.shared .about p { margin: 0; font-size: 15px; }
		.about a { font-weight: 700; }
		@media (max-width: 600px) {
			.shared { padding-top: 32px; }
			.shared .lede { font-size: 17px; margin-bottom: 24px; }
			.choice { padding: 16px; gap: 14px; }
			.file .button { flex: 1 1 100%; }
			.about { align-items: flex-start; padding: 20px; }
			.about img { width: 40px; height: 40px; }
		}
	</style>
	<script>
		// Reads the link in the address's fragment, which never reaches a server, and offers the ways to open it on this
		// system. It fetches nothing, waits for nothing, and never tries to tell whether Campfire is installed: the
		// visitor picks, and the line under the two ways to open it leads to the app's store when nothing happened.
		var sharedLink = (function () {
			// A hand copy of the grammar in ShareLinks.kt (data/model/…/share in the app's repository); keep the two in
			// step. It takes the address in any form the app does, so a messenger's query before the fragment
			// (?fbclid=…) is ignored, though the page reads only its own fragment.
			var maxAddressLength = 4096;
			var maxTitleBytes = 120;
			var address = /^(?:https:\/\/campfire-songbook\.com\/(?:s|app)\/(?:\?[^#\s]*)?#|campfire:\/\/s\/)?(\S+)$/;
			var versionOne = /^1\.(song|setlist)\.([a-z2-7]{16})\.([A-Za-z0-9_-]{1,64})\.([A-Za-z0-9_-]{1,64})\.((?:[A-Za-z0-9_~-]|%[0-9A-Fa-f]{2})*)$/;
			var laterVersion = /^([1-9][0-9]{0,5})\.[A-Za-z0-9._~%-]+$/;

			// The title is percent-encoded UTF-8 of at most 120 bytes, and a title that is not valid UTF-8 makes no link.
			function decodeTitle(encoded) {
				var bytes = [];
				for (var index = 0; index < encoded.length;) {
					if (encoded.charAt(index) === "%") {
						bytes.push(parseInt(encoded.substr(index + 1, 2), 16));
						index += 3;
					} else {
						bytes.push(encoded.charCodeAt(index));
						index++;
					}
				}
				if (bytes.length > maxTitleBytes) return null;
				try {
					return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes));
				} catch (e) {
					return null;
				}
			}

			// A readable link, a link from a later version of Campfire (only its version is known), or null.
			function parse(text) {
				var trimmed = String(text).trim();
				if (trimmed.length > maxAddressLength) return null;
				var match = address.exec(trimmed);
				if (!match) return null;
				var payload = match[1];
				var parts = versionOne.exec(payload);
				if (parts) {
					var title = decodeTitle(parts[5]);
					if (title === null) return null;
					return {
						version: 1, payload: payload, kind: parts[1], title: title,
						// The download is built from the parts, never taken from the link, on the host that answers a
						// dead link with 403 or 404.
						download: "https://dl.dropboxusercontent.com/scl/fi/" + parts[3] + "/" + parts[2] + ".zip?rlkey=" + parts[4] + "&dl=1"
					};
				}
				var later = laterVersion.exec(payload);
				return later && Number(later[1]) > 1 ? { version: Number(later[1]), payload: payload } : null;
			}

			var link = parse(location.hash.slice(1));
			// Safari's banner for an installed app hands it the link. It is no way to install, so it is only a nicety.
			if (link) {
				document.querySelector('meta[name="apple-itunes-app"]').content =
					"app-id=6815160850, app-argument=https://campfire-songbook.com/s/#" + link.payload;
			}
			return { parse: parse, link: link };
		}());
	</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
	<div class="wrap">
		<a class="brand" href="../"><img src="../assets/icon.svg?v=8ba29e56" alt="">Campfire</a>
	</div>
</header>
<div class="wrap">
	<main class="document shared" id="main">
		<p class="cue" id="kind">Shared from Campfire</p>
		<h1 id="title">A song or setlist shared from Campfire</h1>
		<p class="lede" id="lede">This page needs JavaScript to open the link. Campfire itself is on the <a href="../#download">home page</a>.</p>
		<div id="actions"></div>
		<aside class="about">
			<img src="../assets/icon.svg?v=8ba29e56" width="48" height="48" alt="">
			<p><span id="about">Campfire is a free songbook app for lyrics and chords, on every platform and in the browser.</span> <a id="about-link" href="../">Visit campfire-songbook.com</a></p>
		</aside>
	</main>
</div>
<script>
	(function (d) {
		var agent = navigator.userAgent;
		// iPadOS presents itself as a Mac, so an iPad is told apart by its touch screen.
		var ipad = /iPad/.test(agent) || (/Macintosh/.test(agent) && navigator.maxTouchPoints > 1);
		var os = /Android/.test(agent) ? "android" : /iPhone|iPod/.test(agent) || ipad ? "ios" : /Windows/.test(agent) ? "windows" : /Macintosh/.test(agent) ? "macos" : /Linux/.test(agent) ? "linux" : "";
		var mobile = os === "android" || os === "ios";
		// The browsers inside other apps, which often keep a custom scheme or an intent:// address from opening anything.
		var inAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger|Line\/|Snapchat|TikTok|musical_ly|Bytedance|LinkedInApp|Pinterest|Twitter|; wv\)/.test(agent);
		var hungarian = /^hu\b/i.test(navigator.language || "");
		var text = hungarian ? {
			song: "Megosztott dal",
			setlist: "Megosztott lista",
			untitled: "Megosztva a Campfire-ből",
			untitledSong: "Cím nélküli dal",
			untitledSetlist: "Cím nélküli lista",
			ledeSong: "Nyisd meg a Campfire-ben, hogy bekerüljön a dalaid közé.",
			ledeSetlist: "Nyisd meg a Campfire-ben, hogy a lista és a dalai bekerüljenek a könyvtáradba.",
			newer: "Ezt a linket a Campfire egy újabb verziója készítette. A webes alkalmazás mindig a legfrissebb, a telepített alkalmazást pedig frissítsd, hogy megnyithasd.",
			incomplete: "Ez a link hiányos.",
			askAgain: "Kérd el újra attól, aki küldte.",
			openApp: "Megnyitás az alkalmazásban",
			getApp: "Az alkalmazás letöltése",
			openWeb: "Megnyitás a webes alkalmazásban",
			openWebPlain: "A webes alkalmazás megnyitása",
			web: "Ebben a böngészőben fut, telepítés nélkül",
			notInstalled: "Nincs telepítve?",
			outdated: "Frissítés kell?",
			afterInstall: "A Campfire a telepítés után megnyitja a linket.",
			copied: "Kimásoltuk a linket, így a Campfire a telepítés után megnyitja.",
			download: "A fájl letöltése",
			downloadHint: "Kézzel is hozzáadhatod: importáld a fájlt a Campfire beállításainak Könyvtár lapján.",
			inAppBrowser: "Ha a gombok nem működnek, nyisd meg ezt az oldalt a böngésződben.",
			about: "A Campfire ingyenes daloskönyv-alkalmazás dalszövegekhez és akkordokhoz, minden platformra és böngészőbe.",
			aboutLink: "Tovább a campfire-songbook.com-ra",
			platform: { android: "Campfire Androidra", ios: ipad ? "Campfire iPadOS-re" : "Campfire iOS-re", windows: "Campfire Windowsra", macos: "Campfire macOS-re", linux: "Campfire Linuxra", "": "Ha telepítve van ezen az eszközön" },
			store: { android: "Töltsd le a Google Playről", ios: "Töltsd le az App Store-ból", windows: "Töltsd le a Microsoft Store-ból", macos: "Töltsd le a Mac App Store-ból", linux: "Töltsd le a GitHubról", "": "Válaszd ki a platformodat" }
		} : {
			song: "Shared song",
			setlist: "Shared setlist",
			untitled: "Shared from Campfire",
			untitledSong: "Untitled song",
			untitledSetlist: "Untitled setlist",
			ledeSong: "Open it in Campfire to add it to your songs.",
			ledeSetlist: "Open it in Campfire to add the setlist and its songs to your library.",
			newer: "This link was made by a newer version of Campfire. The web app is always up to date, and the installed app needs an update to open it.",
			incomplete: "This link is incomplete.",
			askAgain: "Ask the person who sent it for it again.",
			openApp: "Open in the app",
			getApp: "Get the app",
			openWeb: "Open in the web app",
			openWebPlain: "Open the web app",
			web: "Runs in this browser, with nothing to install",
			notInstalled: "Not installed?",
			outdated: "Need the update?",
			afterInstall: "Campfire opens the link once it's installed.",
			copied: "We copied the link, so Campfire can open it once it's installed.",
			download: "Download the file",
			downloadHint: "To add it by hand, import the file from the Library tab of Campfire's settings.",
			inAppBrowser: "Open this page in your browser if the buttons don't work.",
			about: "Campfire is a free songbook app for lyrics and chords, on every platform and in the browser.",
			aboutLink: "Visit campfire-songbook.com",
			platform: { android: "Campfire for Android", ios: ipad ? "Campfire for iPadOS" : "Campfire for iOS", windows: "Campfire for Windows", macos: "Campfire for macOS", linux: "Campfire for Linux", "": "If it's installed on this device" },
			store: { android: "Get it on Google Play", ios: "Get it on the App Store", windows: "Get it from the Microsoft Store", macos: "Get it on the Mac App Store", linux: "Download it from GitHub", "": "Pick your platform" }
		};
		// The same stores and downloads as the rest of the site; without a known system, the list of every platform.
		var native = {
			android: "https://play.google.com/store/apps/details?id=com.pandulapeter.campfire",
			ios: "https://apps.apple.com/app/id6815160850",
			windows: "https://apps.microsoft.com/detail/9MSR62F288M1",
			macos: "https://apps.apple.com/app/id6815160850",
			linux: "https://github.com/pandulapeter/campfire/releases/latest",
			"": "../#download"
		};
		// Line icons in the style of the home page's: a phone or a computer for the app, a globe for the web app, and an
		// arrow into a tray for the file.
		var icons = {
			phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
			computer: '<rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/>',
			globe: '<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5Z"/>',
			download: '<path d="M12 3.5v11m-4.5-4.5 4.5 4.5 4.5-4.5M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/>'
		};
		var link = sharedLink.link;
		var actions = d.getElementById("actions");
		d.documentElement.lang = hungarian ? "hu" : "en";
		d.getElementById("about").textContent = text.about;
		d.getElementById("about-link").textContent = text.aboutLink;

		function element(tag, className, content) {
			var node = d.createElement(tag);
			if (className) node.className = className;
			if (content) node.textContent = content;
			return node;
		}

		function icon(name) {
			return '<svg viewBox="0 0 24 24" aria-hidden="true">' + icons[name] + "</svg>";
		}

		function external(node) {
			node.target = "_blank";
			node.rel = "noopener";
			return node;
		}

		// A card with an icon, a label, and a line under it. The labels are only ever text, never markup.
		function choice(iconName, label, detail, href) {
			var node = element("a", "choice");
			node.href = href;
			node.innerHTML = icon(iconName) + "<div><strong></strong><span></span></div>";
			node.querySelector("strong").textContent = label;
			node.querySelector("span").textContent = detail;
			return node;
		}

		// Phones and tablets get the app first, computers the web app, as everywhere else on the site.
		function choices(app, web) {
			var node = element("div", "choices");
			var first = mobile ? app : web;
			first.classList.add("main");
			node.appendChild(first);
			node.appendChild(mobile ? web : app);
			actions.appendChild(node);
		}

		if (inAppBrowser) actions.appendChild(element("p", "in-app", text.inAppBrowser));
		var device = mobile ? "phone" : "computer";

		// The title is only ever text, never markup, and only for display: the app shows the real one when it imports.
		if (!link) {
			d.getElementById("kind").textContent = "Campfire";
			d.getElementById("title").textContent = text.incomplete;
			d.getElementById("lede").textContent = text.askAgain;
			d.title = text.incomplete.replace(/\.$/, "") + " – Campfire";
			var getApp = choice(device, text.getApp, text.platform[os], native[os]);
			if (os === "") getApp.querySelector("span").textContent = text.store[""];
			else external(getApp);
			choices(getApp, external(choice("globe", text.openWebPlain, text.web, "../app/")));
			return;
		}
		var readable = link.version === 1;
		var setlist = readable && link.kind === "setlist";
		d.getElementById("kind").textContent = !readable ? "Campfire" : setlist ? text.setlist : text.song;
		var title = !readable ? text.untitled : link.title || (setlist ? text.untitledSetlist : text.untitledSong);
		d.getElementById("title").textContent = title;
		d.getElementById("lede").textContent = !readable ? text.newer : setlist ? text.ledeSetlist : text.ledeSong;
		d.title = readable ? title + " – Campfire" : title;

		// The address of the scheme carries the payload in its path, as Android's intent:// claims the fragment. There,
		// Chrome opens the app when it is installed and Play otherwise, which hands the link to the app after the
		// install, through the referrer (encoded once, then once more as part of the fallback's own address).
		var scheme = "campfire://s/" + link.payload;
		var play = native.android + "&referrer=" + encodeURIComponent("campfire_link=" + link.payload);
		var intent = "intent://s/" + link.payload + "#Intent;scheme=campfire;package=com.pandulapeter.campfire;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
		var landing = "https://campfire-songbook.com/s/#" + link.payload;

		choices(
			choice(device, text.openApp, text.platform[os], os === "android" ? intent : scheme),
			external(choice("globe", text.openWeb, text.web, "../app/#" + link.payload))
		);

		// The app's store, for when opening it did nothing. Play gets the link through the referrer, as above.
		var fallback = element("p", "fallback", (readable ? text.notInstalled : text.outdated) + " ");
		var store = element("a", "", text.store[os]);
		store.href = os === "android" ? play : native[os];
		if (os !== "") external(store);
		fallback.appendChild(store);
		actions.appendChild(fallback);
		if (readable && os === "android") fallback.appendChild(d.createTextNode(" " + text.afterInstall));
		if (readable && os === "ios") {
			// Campfire looks for a link on the clipboard on its first launch, so the store link copies it first, inside
			// the tap that the clipboard requires, and then goes on to the App Store as an ordinary link.
			store.addEventListener("click", function () {
				if (!navigator.clipboard) return;
				navigator.clipboard.writeText(landing).then(function () {
					var copied = fallback.querySelector(".copied") || fallback.appendChild(element("span", "copied"));
					copied.textContent = " " + text.copied;
				}, function () {});
			});
		}

		if (readable) {
			var file = element("div", "file");
			var download = element("a", "button tonal small");
			download.href = link.download;
			download.innerHTML = icon("download");
			download.appendChild(d.createTextNode(text.download));
			file.appendChild(download);
			file.appendChild(element("p", "", text.downloadHint));
			actions.appendChild(file);
		}
	}(document));
</script>
</body>
</html>
