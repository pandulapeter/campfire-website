	<script>
		// Reads the link in the address's fragment, which never reaches a server, and offers the ways to open it on this
		// system. It fetches nothing, waits for nothing, and never tries to tell whether Campfire is installed: the
		// visitor picks, and the line under the two ways to open it leads to the app's store when nothing happened.
		var sharedLink = (function () {
			// A hand copy of the grammar in ShareLinks.kt (data/model/…/share in the app's repository); keep the two in
			// step. It takes the address in any form the app does, so a messenger's query before the fragment
			// (?fbclid=…) is ignored, though the page reads only its own fragment.
			var maxAddressLength = 4096;
			var maxTitleBytes = 120;
			var address = /^(?:https:\/\/campfire-songbook\.com\/(?:s|app)\/(?:\?[^#\s]*)?#|campfire:\/\/s\/)?(\S+)$/;
			var versionOne = /^1\.(song|setlist)\.([a-z2-7]{16})\.([A-Za-z0-9_-]{1,64})\.([A-Za-z0-9_-]{1,64})\.((?:[A-Za-z0-9_~-]|%[0-9A-Fa-f]{2})*)$/;
			var laterVersion = /^([1-9][0-9]{0,5})\.[A-Za-z0-9._~%-]+$/;

			// The title is percent-encoded UTF-8 of at most 120 bytes, and a title that is not valid UTF-8 makes no link.
			function decodeTitle(encoded) {
				var bytes = [];
				for (var index = 0; index < encoded.length;) {
					if (encoded.charAt(index) === "%") {
						bytes.push(parseInt(encoded.substr(index + 1, 2), 16));
						index += 3;
					} else {
						bytes.push(encoded.charCodeAt(index));
						index++;
					}
				}
				if (bytes.length > maxTitleBytes) return null;
				try {
					return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes));
				} catch (e) {
					return null;
				}
			}

			// A readable link, a link from a later version of Campfire (only its version is known), or null.
			function parse(text) {
				var trimmed = String(text).trim();
				if (trimmed.length > maxAddressLength) return null;
				var match = address.exec(trimmed);
				if (!match) return null;
				var payload = match[1];
				var parts = versionOne.exec(payload);
				if (parts) {
					var title = decodeTitle(parts[5]);
					if (title === null) return null;
					return {
						version: 1, payload: payload, kind: parts[1], title: title,
						// The download is built from the parts, never taken from the link, on the host that answers a
						// dead link with 403 or 404.
						download: "https://dl.dropboxusercontent.com/scl/fi/" + parts[3] + "/" + parts[2] + ".zip?rlkey=" + parts[4] + "&dl=1"
					};
				}
				var later = laterVersion.exec(payload);
				return later && Number(later[1]) > 1 ? { version: Number(later[1]), payload: payload } : null;
			}

			var link = parse(location.hash.slice(1));
			// Safari's banner for an installed app hands it the link. It is no way to install, so it is only a nicety.
			if (link) {
				document.querySelector('meta[name="apple-itunes-app"]').content =
					"app-id=6815160850, app-argument=https://campfire-songbook.com/s/#" + link.payload;
			}
			return { parse: parse, link: link };
		}());
	</script>

				openApp: "Deschide în aplicație",
				getApp: "Descarcă aplicația",
				openWeb: "Deschide în aplicația web",
				openWebPlain: "Deschide aplicația web",
				web: "Rulează în acest browser, fără nimic de instalat",
				notInstalled: "Nu e instalată?",
				outdated: "Trebuie actualizată?",
				afterInstall: "Campfire deschide linkul după instalare.",
				copied: "Am copiat linkul, ca Campfire să-l poată deschide după instalare.",
				download: "Descarcă fișierul",
				downloadHint: "Îl poți importa manual după ce deschizi aplicația.",
				inAppBrowser: "Deschide această pagină în browser dacă butoanele nu funcționează.",
				about: "Campfire este o aplicație gratuită de cântece, cu versuri și acorduri, pe orice platformă și în browser.",
				aboutLink: "Vizitează campfire-songbook.com",
				platform: { android: "Campfire pentru Android", ios: "Campfire pentru iOS", ipados: "Campfire pentru iPadOS", windows: "Campfire pentru Windows", macos: "Campfire pentru macOS", linux: "Campfire pentru Linux", "": "Dacă aplicația e instalată pe acest dispozitiv" },
				store: { android: "Descarcă de pe Google Play", ios: "Descarcă din App Store", windows: "Descarcă din Microsoft Store", macos: "Descarcă din Mac App Store", linux: "Descarcă de pe GitHub", "": "Alege-ți platforma" }
			}
		};
		var text = texts[language];
		var platform = ipad ? "ipados" : os;
		// The home page in the same language.
		var home = "../" + (language === "en" ? "" : language + "/");
		// The same stores and downloads as the rest of the site; without a known system, the list of every platform.
		var native = {
			android: "https://play.google.com/store/apps/details?id=com.pandulapeter.campfire",
			ios: "https://apps.apple.com/app/id6815160850",
			windows: "https://apps.microsoft.com/detail/9MSR62F288M1",
			macos: "https://apps.apple.com/app/id6815160850",
			linux: "https://github.com/pandulapeter/campfire/releases/latest",
			"": home + "#download"
		};
		// Line icons in the style of the home page's: a phone or a computer for the app, a globe for the web app, and an
		// arrow into a tray for the file.
		var icons = {
			phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
			computer: '<rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/>',
			globe: '<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5Z"/>',
			download: '<path d="M12 3.5v11m-4.5-4.5 4.5 4.5 4.5-4.5M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/>'
		};
		var link = sharedLink.link;
		var actions = d.getElementById("actions");
		d.documentElement.lang = language;
		d.getElementById("about-link").href = home;
		d.getElementById("about").textContent = text.about;
		d.getElementById("about-link").textContent = text.aboutLink;

		function element(tag, className, content) {
			var node = d.createElement(tag);
			if (className) node.className = className;
			if (content) node.textContent = content;
			return node;
		}

		function icon(name) {
			return '<svg viewBox="0 0 24 24" aria-hidden="true">' + icons[name] + "</svg>";
		}

		function external(node) {
			node.target = "_blank";
			node.rel = "noopener";
			return node;
		}

		// A card with an icon, a label, and a line under it. The labels are only ever text, never markup.
		function choice(iconName, label, detail, href) {
			var node = element("a", "choice");
			node.href = href;
			node.innerHTML = icon(iconName) + "<div><strong></strong><span></span></div>";
			node.querySelector("strong").textContent = label;
			node.querySelector("span").textContent = detail;
			return node;
		}

		// Phones and tablets get the app first, computers the web app, as everywhere else on the site.
		function choices(app, web) {
			var node = element("div", "choices");
			var first = mobile ? app : web;
			first.classList.add("main");
			node.appendChild(first);
			node.appendChild(mobile ? web : app);
			actions.appendChild(node);
		}

		if (inAppBrowser) actions.appendChild(element("p", "in-app", text.inAppBrowser));
		var device = mobile ? "phone" : "computer";

		// The title is only ever text, never markup, and only for display: the app shows the real one when it imports.
		if (!link) {
			d.getElementById("kind").textContent = "Campfire";
			d.getElementById("title").textContent = text.incomplete;
			d.getElementById("lede").textContent = text.askAgain;
			d.title = text.incomplete.replace(/\.$/, "") + " – Campfire";
			var getApp = choice(device, text.getApp, text.platform[platform], native[os]);
			if (os === "") getApp.querySelector("span").textContent = text.store[""];
			else external(getApp);
			choices(getApp, external(choice("globe", text.openWebPlain, text.web, "../app/")));
			return;
		}
		var readable = link.version === 1;
		var setlist = readable && link.kind === "setlist";
		d.getElementById("kind").textContent = !readable ? "Campfire" : setlist ? text.setlist : text.song;
		var title = !readable ? text.untitled : link.title || (setlist ? text.untitledSetlist : text.untitledSong);
		d.getElementById("title").textContent = title;
		d.getElementById("lede").textContent = !readable ? text.newer : setlist ? text.ledeSetlist : text.ledeSong;
		d.title = readable ? title + " – Campfire" : title;

		// The address of the scheme carries the payload in its path, as Android's intent:// claims the fragment. There,
		// Chrome opens the app when it is installed and Play otherwise, which hands the link to the app after the
		// install, through the referrer (encoded once, then once more as part of the fallback's own address).
		var scheme = "campfire://s/" + link.payload;
		var play = native.android + "&referrer=" + encodeURIComponent("campfire_link=" + link.payload);
		var intent = "intent://s/" + link.payload + "#Intent;scheme=campfire;package=com.pandulapeter.campfire;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
		var landing = "https://campfire-songbook.com/s/#" + link.payload;

		choices(
			choice(device, text.openApp, text.platform[platform], os === "android" ? intent : scheme),
			external(choice("globe", text.openWeb, text.web, "../app/#" + link.payload))
		);

		// The app's store, for when opening it did nothing. Play gets the link through the referrer, as above.
		var fallback = element("p", "fallback", (readable ? text.notInstalled : text.outdated) + " ");
		var store = element("a", "", text.store[os]);
		store.href = os === "android" ? play : native[os];
		if (os !== "") external(store);
		fallback.appendChild(store);
		actions.appendChild(fallback);
		if (readable && os === "android") fallback.appendChild(d.createTextNode(" " + text.afterInstall));
		if (readable && os === "ios") {
			// Campfire looks for a link on the clipboard on its first launch, so the store link copies it first, inside
			// the tap that the clipboard requires, and then goes on to the App Store as an ordinary link.
			store.addEventListener("click", function () {
				if (!navigator.clipboard) return;
				navigator.clipboard.writeText(landing).then(function () {
					var copied = fallback.querySelector(".copied") || fallback.appendChild(element("span", "copied"));
					copied.textContent = " " + text.copied;
				}, function () {});
			});
		}

		if (readable) {
			var file = element("div", "file");
			var download = element("a", "download");
			download.href = link.download;
			download.innerHTML = icon("download");
			download.appendChild(d.createTextNode(text.download));
			file.appendChild(download);
			file.appendChild(element("p", "", text.downloadHint));
			actions.appendChild(file);
		}
	}(document));
</script>
</body>
</html>
